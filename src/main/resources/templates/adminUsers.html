<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Manage Users - Admin</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, rgba(88, 86, 214, 0.25), transparent 35%),
                radial-gradient(circle at bottom right, rgba(0, 212, 255, 0.18), transparent 35%),
                linear-gradient(135deg, #0f172a, #111827 50%, #0b1120);
            color: white;
        }

        .navbar {
            width: 100%;
            padding: 18px 45px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 9px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            background: rgba(255,255,255,0.1);
        }

        .logout-btn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 45px auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #cbd5e1;
        }

        .table-card {
            padding: 25px;
            border-radius: 22px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(18px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        th {
            padding: 16px 14px;
            text-align: left;
            color: #cbd5e1;
            font-size: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        td {
            padding: 18px 14px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
        }

        tr:hover {
            background: rgba(255,255,255,0.04);
        }

        .user-id {
            color: #a78bfa;
            font-weight: 700;
        }

        .user-name {
            font-weight: 600;
        }

        .email {
            color: #cbd5e1;
        }

        .role-badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: rgba(59,130,246,0.15);
            border: 1px solid rgba(59,130,246,0.3);
            color: #93c5fd;
            font-size: 13px;
            font-weight: 700;
        }

        .admin-role {
            background: rgba(255,193,7,0.15);
            border-color: rgba(255,193,7,0.3);
            color: #ffc107;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 11px 20px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 800px) {

            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 15px;
            }

            .header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            📚 Online Book Store
        </div>

        <ul class="nav-links">

            <li>
                <a th:href="@{/admin}">
                    👑 Dashboard
                </a>
            </li>

            <li>
                <a th:href="@{/}">
                    🏠 Home
                </a>
            </li>

            <li>
                <a th:href="@{/logout}" class="logout-btn">
                    🚪 Logout
                </a>
            </li>

        </ul>

    </nav>


    <div class="container">

        <div class="header">

            <h1>
                👥 Manage Users
            </h1>

            <p>
                View all registered users of the bookstore
            </p>

        </div>


        <div class="table-card">

            <table>

                <thead>

                    <tr>
                        <th>User ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                    </tr>

                </thead>

                <tbody>

                    <tr th:each="user : ${users}">

                        <td class="user-id"
                            th:text="'#' + ${user.id}">
                            #1
                        </td>

                        <td class="user-name"
                            th:text="${user.name}">
                            User
                        </td>

                        <td class="email"
                            th:text="${user.email}">
                            email@example.com
                        </td>

                        <td>

                            <span class="role-badge"
                                  th:classappend="${user.role == 'ADMIN'} ? ' admin-role' : ''"
                                  th:text="${user.role != null ? user.role : 'USER'}">
                                USER
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(users)}">

                        <td colspan="4" class="empty">

                            <h2>
                                👥 No Users Found
                            </h2>

                            <p>
                                There are currently no registered users.
                            </p>

                        </td>

                    </tr>

                </tbody>

            </table>


            <div style="text-align:center;">

                <a th:href="@{/admin}" class="back-btn">
                    ← Back to Dashboard
                </a>

            </div>

        </div>

    </div>

</body>
</html>
